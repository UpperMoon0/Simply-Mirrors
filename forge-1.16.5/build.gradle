buildscript {
    repositories { maven { url 'https://repo.spongepowered.org/repository/maven-public/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.54' }
apply plugin: 'org.spongepowered.mixin'
def props = new Properties()
file('../gradle.properties').withInputStream { props.load(it) }
group = props.maven_group
version = props.mod_version
base { archivesName = 'simply_mirrors-forge-1.16.5' }
repositories { mavenCentral(); maven { url 'https://repo.spongepowered.org/repository/maven-public/' } }
java { toolchain.languageVersion = JavaLanguageVersion.of(8); withSourcesJar() }
apply from: file('../tools/forge16-sources.gradle')
sourceSets.main.resources.srcDir '../common-1.16.5/src/main/resources'
minecraft {
    mappings channel: 'official', version: '1.16.5'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run/client'); mods { simply_mirrors { source sourceSets.main } } }
        server { workingDirectory project.file('run/server'); args '--nogui'; mods { simply_mirrors { source sourceSets.main } } }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin { add sourceSets.main, 'simplymirrors.refmap.json'; config 'simplymirrors.mixins.json' }
processResources { inputs.property 'version', version; filesMatching('META-INF/mods.toml') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; sourceCompatibility='1.8'; targetCompatibility='1.8' }
tasks.withType(JavaExec).configureEach { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) } }
jar {
    from('../LICENSE'); from('../NOTICE'); from('../licenses') { into 'licenses' }
    manifest { attributes 'MixinConfigs': 'simplymirrors.mixins.json' }
    finalizedBy 'reobfJar'
}
apply from: file('../tools/visual.gradle')

sourceSets.main.resources.srcDir('../common-assets/src/main/resources')
