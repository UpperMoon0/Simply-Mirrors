if (!providers.gradleProperty('visualTest').isPresent()) return

def mc = providers.gradleProperty('visualMc').get()
def loader = providers.gradleProperty('visualLoader').get()
def port = providers.gradleProperty('visualPort').get()
def runName = providers.gradleProperty('visualRunName').orElse('visual').get()
if (!(runName ==~ /[a-z0-9-]+/)) throw new GradleException('Invalid visual run name')
logger.lifecycle("Visual target: ${mc}/${loader}")
layout.buildDirectory = file('build/visual')
if (!(mc == '1.16.5' && loader == 'forge')) {
sourceSets.main.java.srcDir(rootProject.file(rootProject == project ? '../visual-tests/common/java' : 'visual-tests/common/java'))
sourceSets.main.java.srcDir(rootProject.file(rootProject == project ? "../visual-tests/${mc}/java" : "visual-tests/${mc}/java"))
}
sourceSets.main.resources.srcDir(rootProject.file(rootProject == project ? '../visual-tests/resources' : 'visual-tests/resources'))
processResources {
    inputs.property 'visualTest', true
    doLast {
        def fabric = new File(destinationDir, 'fabric.mod.json')
        if (fabric.exists()) {
            def json = new groovy.json.JsonSlurper().parse(fabric)
            json.mixins.add('simplymirrors.visual.mixins.json')
            fabric.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
        def neo = new File(destinationDir, 'META-INF/neoforge.mods.toml')
        if (neo.exists()) neo.append('\n[[mixins]]\nconfig = "simplymirrors.visual.mixins.json"\n')
    }
}
if (mc == '1.16.5' && loader == 'forge') {
    minecraft.runs {
        visualClient {
            taskName 'runVisualClient'
            parent project.minecraft.runs.getByName('client')
            workingDirectory project.file("run/${runName}-client")
            property 'simplymirrors.visualPort', port
            jvmArgs '-Xmx1024m'
            args '--width', '960', '--height', '540', '--mixin', 'simplymirrors.visual.mixins.json'
            mods { simply_mirrors { source sourceSets.main } }
        }
        visualServer {
            taskName 'runVisualServer'
            parent project.minecraft.runs.getByName('server')
            workingDirectory project.file("run/${runName}-server")
            jvmArgs '-Xmx1024m'
            args '--nogui'
            mods { simply_mirrors { source sourceSets.main } }
        }
    }
} else if (mc == '26.1.2' && loader == 'neoforge') {
    neoForge.runs {
        visualClient {
            client()
            gameDirectory = project.file("run/${runName}-client")
            systemProperty 'simplymirrors.visualTest', 'true'
            systemProperty 'simplymirrors.visualPort', port
            jvmArguments.addAll '-Xmx1024m'
            programArguments.addAll '--width', '960', '--height', '540'
        }
        visualServer {
            server()
            gameDirectory = project.file("run/${runName}-server")
            jvmArguments.addAll '-Xmx1024m'
            programArgument '--nogui'
        }
    }
} else {
    loom.runs {
        visualClient {
            client()
            runDir("run/${runName}-client")
            property 'simplymirrors.visualTest', 'true'
            property 'simplymirrors.visualPort', port
            if (providers.gradleProperty('atm10Sky').isPresent()) property 'simplymirrors.atm10Sky', 'true'
            vmArg providers.gradleProperty('atm10Sky').isPresent() ? '-Xmx8192m' : '-Xmx2048m'
            programArgs '--width', '960', '--height', '540'
        }
        visualServer {
            server()
            runDir("run/${runName}-server")
            vmArg '-Xmx1024m'
            programArg 'nogui'
        }
    }
    if (loader == 'forge') loom.forge.mixinConfig('simplymirrors.visual.mixins.json')
}

// TEMPORARY ATM10-SKY DIAGNOSTIC ONLY. Production owo's obfuscated mixin
// cannot resolve the Screen lambda in a Loom development runtime. Keep the
// original verified mod JAR and let Loom remap it for its dev namespace.
// The isolated client removes the duplicate from mods/, but not the source pack.
// Delete alongside all other ATM10-specific diagnostics before merging.
if (mc == '1.21.1' && loader == 'neoforge' && providers.gradleProperty('atm10Sky').isPresent()) {
    def owo = rootProject.file('build/atm10-sky/game/mods/owo-lib-neoforge-0.12.15.6-beta.1+1.21.jar')
    if (!owo.isFile()) throw new GradleException("Missing verified ATM10 owo jar: ${owo}")
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(owo.bytes).encodeHex().toString()
    if (digest != '5fc306ad3d42e1dc26812f2df856e7c232376405caab6af4f5aaffe89cd2b256') throw new GradleException("ATM10 owo checksum mismatch: ${owo}")
    // Under Architectury Loom, NeoForge's production JarJar resolver does not
    // automatically expose libraries embedded inside this mod when the parent
    // is a development modLocalRuntime dependency. Extract only libraries from
    // the original checksum-verified parent, preserving their exact bytes.
    // This is strictly a temporary ATM10 harness compatibility workaround.
    def requiredLibraryKeys = [
        'io.wispforest:endec',
        'io.wispforest.endec:gson',
        'io.wispforest.endec:netty',
        'io.wispforest.endec:jankson',
        'blue.endless:jankson'
    ] as Set
    def nestedLibraries = []
    new java.util.zip.ZipFile(owo).withCloseable { archive ->
        def metadata = archive.getEntry('META-INF/jarjar/metadata.json')
        if (metadata == null) throw new GradleException('Verified ATM10 owo has no JarJar metadata')
        def entries = new groovy.json.JsonSlurper().parse(archive.getInputStream(metadata)).jars ?: []
        entries.each { entry ->
            def key = "${entry.identifier?.group}:${entry.identifier?.artifact}"
            if (!requiredLibraryKeys.contains(key)) return
            def nestedPath = entry.path ?: entry.file
            if (!(nestedPath instanceof String) || !nestedPath.endsWith('.jar'))
                throw new GradleException("Invalid owo JarJar library path for ${key}: ${nestedPath}")
            def nested = archive.getEntry(nestedPath)
            if (nested == null) throw new GradleException("Missing owo JarJar library ${nestedPath}")
            def bytes = archive.getInputStream(nested).bytes
            def childDigest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
            def child = layout.buildDirectory.file("atm10-owo-libraries/${childDigest}.jar").get().asFile
            child.parentFile.mkdirs()
            if (child.exists() && !java.util.Arrays.equals(child.bytes, bytes))
                throw new GradleException("Existing diagnostic library differs: ${child}")
            if (!child.exists()) child.bytes = bytes
            nestedLibraries.add([id: key, jar: child, sha256: childDigest])
        }
    }
    if (!nestedLibraries.any { it.id == 'io.wispforest:endec' })
        throw new GradleException('Verified ATM10 owo has no bundled Endec library; inspect its JarJar metadata before selecting a different version')
    dependencies {
        modLocalRuntime files(owo)
        forgeRuntimeLibrary files(nestedLibraries.collect { it.jar })
    }
    logger.lifecycle('ATM10_SKY_OWO_DEV_REMAP_VERIFIED sha256=' + digest)
    nestedLibraries.each { logger.lifecycle("ATM10_SKY_OWO_NESTED_LIBRARY ${it.id} sha256=${it.sha256}") }
}
