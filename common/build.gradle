plugins { id 'java-library' }
java { toolchain.languageVersion = JavaLanguageVersion.of(8); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.joml:joml:1.10.5'
}
test { useJUnit(); testLogging { events 'failed', 'skipped' } }

// Exercise the optional bridge without loading Minecraft or an OpenGL context.
tasks.named('compileTestJava') {
    source rootProject.file('common-client/src/main/java/com/nstut/simplymirrors/client/IrisCameraState.java')
    source rootProject.file('common-1.21.1/src/main/java/com/nstut/simplymirrors/client/ShaderMatrices.java')
}

// Native GL tests run on the actual OS of the reviewed CI graphics worker.
// Gradle must resolve the *matching* LWJGL binary jars: hardcoding Linux
// natives made the isolated Windows GPU qualification fail before GLFW init.
def glHostOs = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT)
def glNativeClassifier = glHostOs.contains('windows') ? 'natives-windows' :
    (glHostOs.contains('linux') ? 'natives-linux' : null)
if (glNativeClassifier == null) {
    throw new GradleException('No reviewed native LWJGL GL test binaries for this operating system')
}
sourceSets { shaderGlTest { java.srcDir rootProject.file('tools/gl-tests') } }
dependencies {
    shaderGlTestImplementation sourceSets.main.output
    shaderGlTestImplementation 'org.lwjgl:lwjgl:3.3.3'
    shaderGlTestImplementation 'org.lwjgl:lwjgl-opengl:3.3.3'
    shaderGlTestImplementation 'org.lwjgl:lwjgl-glfw:3.3.3'
    shaderGlTestRuntimeOnly "org.lwjgl:lwjgl:3.3.3:${glNativeClassifier}"
    shaderGlTestRuntimeOnly "org.lwjgl:lwjgl-opengl:3.3.3:${glNativeClassifier}"
    shaderGlTestRuntimeOnly "org.lwjgl:lwjgl-glfw:3.3.3:${glNativeClassifier}"
}
tasks.named('compileShaderGlTestJava') {
    source rootProject.file('common-client/src/main/java/com/nstut/simplymirrors/client/GlTextureSnapshot.java')
    source rootProject.file('common-client/src/main/java/com/nstut/simplymirrors/client/GlHistoryBackupPool.java')
    source rootProject.file('common-client/src/main/java/com/nstut/simplymirrors/client/GlMirrorComposite.java')
    source rootProject.file('common-client/src/main/java/com/nstut/simplymirrors/client/ShaderRenderTargetSnapshot.java')
    source rootProject.file('common-client/src/main/java/com/nstut/simplymirrors/client/DepthTextureParity.java')
    source rootProject.file('common-client/src/main/java/com/nstut/simplymirrors/client/ReflectionFramebufferParity.java')
}
tasks.register('shaderHistoryGlTest', JavaExec) {
    group = 'verification'
    description = 'Checks native shader history isolation in a real OpenGL context.'
    dependsOn tasks.named('shaderGlTestClasses')
    classpath = sourceSets.shaderGlTest.runtimeClasspath
    mainClass = 'com.nstut.simplymirrors.client.ShaderHistoryGlTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}


tasks.register('shaderHistoryCopyImageGlTest', JavaExec) {
    group = 'verification'
    description = 'Checks opt-in GL 4.3 exact-format image copies, including GL 3.3 fallback.'
    dependsOn tasks.named('shaderGlTestClasses')
    classpath = sourceSets.shaderGlTest.runtimeClasspath
    mainClass = 'com.nstut.simplymirrors.client.ShaderHistoryGlTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    jvmArgs '-Dsimplymirrors.historyCopyImage=true'
}

// Manual, isolated Mesa compositor baseline vs batch comparison; no Minecraft process.
tasks.register('mirrorCompositeBenchmark', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('shaderGlTestClasses')
    classpath = sourceSets.shaderGlTest.runtimeClasspath
    mainClass = 'com.nstut.simplymirrors.client.MirrorCompositeGlBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
