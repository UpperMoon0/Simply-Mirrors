plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
version = shared.mod_version
group = shared.maven_group
base { archivesName = 'simply_mirrors-neoforge-26.1.2' }
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.java.srcDir('../common-client/src/main/java')
sourceSets.main.java.srcDir('../common-26.1.2/src/main/java')
sourceSets.main.resources.srcDir('../common-26.1.2/src/main/resources')
neoForge {
    version = '26.1.2.76'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { simply_mirrors { sourceSet sourceSets.main } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
}
tasks.withType(Jar).configureEach { from('../LICENSE'); from('../NOTICE'); from('../licenses') { into 'licenses' } }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
