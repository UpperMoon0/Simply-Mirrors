// Platform configuration is defined by the root build.

loom { forge { mixinConfig 'simplymirrors.mixins.json' } }
jar { manifest { attributes 'MixinConfigs': 'simplymirrors.mixins.json' } }

// Recipe browsing in the development client only; never published or bundled.
repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}
dependencies {
    modLocalRuntime('mezz.jei:jei-1.20.1-forge:15.20.0.106') {
        // Use the complete mod without adding duplicate API/library jars.
        transitive = false
    }
}
