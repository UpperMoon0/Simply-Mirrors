name: Mirror shader acceptance
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-shaders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shader:
    name: Complementary ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: fabric-1.16.5, java: '8', gradle_java: '21'}
          - {target: forge-1.16.5, java: '8', gradle_java: '21'}
          - {target: fabric-1.20.1, java: '17', gradle_java: '21'}
          - {target: forge-1.20.1, java: '17', gradle_java: '21'}
          - {target: fabric-1.21.1, java: '21', gradle_java: '21'}
          - {target: neoforge-1.21.1, java: '21', gradle_java: '21'}
          - {target: fabric-26.1.2, java: '25', gradle_java: '25'}
          - {target: neoforge-26.1.2, java: '25', gradle_java: '25'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.gradle_java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxi6 libxinerama1
          python -m pip install pillow
          chmod +x gradlew forge-1.16.5/gradlew fabric-26.1.2/gradlew neoforge-26.1.2/gradlew
      - name: Render all six faces with Complementary enabled
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python tools/visual_smoke.py --target ${{ matrix.target }} --shaders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-shader-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/run/shader-evidence/**
            ${{ matrix.target }}/run/shader-client/visual-evidence/**
            ${{ matrix.target }}/run/shader-client/logs/**
            ${{ matrix.target }}/run/shader-client/crash-reports/**
          if-no-files-found: warn



  enclosed-baseline:
    name: Enclosed Complementary baseline (NeoForge 1.21.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxi6 libxinerama1
          python -m pip install pillow
          chmod +x gradlew
      - name: Render enclosed room with identical shaders and no Euphoria Patcher
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: >-
          xvfb-run -a -s '-screen 0 1280x720x24'
          python tools/visual_smoke.py
          --target neoforge-1.21.1 --shaders --enclosed
          --run-name enclosed-baseline --require-entity --force-stencil --check-motion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-enclosed-baseline
          path: |
            neoforge-1.21.1/run/enclosed-baseline-evidence/**
            neoforge-1.21.1/run/enclosed-baseline-client/visual-evidence/**
            neoforge-1.21.1/run/enclosed-baseline-client/logs/**
            neoforge-1.21.1/run/enclosed-baseline-client/crash-reports/**
          if-no-files-found: warn


  euphoria-compat:
    name: Euphoria Patcher shader compatibility (NeoForge 1.21.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxi6 libxinerama1
          python -m pip install pillow
          chmod +x gradlew
      - name: Download checksum-pinned Euphoria Patcher
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import urllib.request
          target = pathlib.Path("build/shader-modifier-repro/EuphoriaPatcher-1.10.5-r5.9.3-neoforge.jar")
          target.parent.mkdir(parents=True, exist_ok=True)
          url = "https://cdn.modrinth.com/data/4H6sumDB/versions/QMsRXtSJ/EuphoriaPatcher-1.10.5-r5.9.3-neoforge.jar"
          expected = "19e5528f6284f68d28e9e8b17a9531bb0f8e0ab862e3ab93a1b53fe3f18765cfa38cc512e66c2d4b308e6783307d132e8b5c337db4a39b016d75e6830376070a"
          request = urllib.request.Request(url, headers={"User-Agent": "SimplyMirrors-repro/1.0"})
          with urllib.request.urlopen(request, timeout=120) as response:
              content = response.read()
          digest = hashlib.sha512(content).hexdigest()
          if digest != expected:
              raise ValueError("Euphoria Patcher checksum mismatch")
          target.write_bytes(content)
          print(f"Verified {target}: sha512={digest}")
          PY
      - name: Render with Euphoria Patcher in disposable shader fixture
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: >-
          xvfb-run -a -s '-screen 0 1280x720x24'
          python tools/visual_smoke.py
          --target neoforge-1.21.1 --shaders --enclosed
          --extra-client-mod build/shader-modifier-repro/EuphoriaPatcher-1.10.5-r5.9.3-neoforge.jar
          --run-name euphoria-compat --require-entity --force-stencil --check-motion
      - name: Verify exact Iris framebuffer callback contract (no modpack)
        # Independent API regression must still execute when the visual gate fails.
        if: success() || failure()
        run: python tools/verify_iris_framebuffer_api.py --cache build/shader-dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-euphoria-compat
          path: |
            neoforge-1.21.1/run/euphoria-compat-evidence/**
            neoforge-1.21.1/run/euphoria-compat-client/visual-evidence/**
            neoforge-1.21.1/run/euphoria-compat-client/logs/**
            neoforge-1.21.1/run/euphoria-compat-client/crash-reports/**
          if-no-files-found: warn
