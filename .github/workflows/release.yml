name: Build and release
# Main-branch version changes validate artifacts but never publish automatically.
# Publishing requires workflow_dispatch with publish=true after authorization.
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to GitHub and CurseForge (main only)
        type: boolean
        default: false
      resume_run:
        description: Inspected failed run with accepted CurseForge receipts (recovery only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: simply-mirrors-release
  cancel-in-progress: false
jobs:
  build:
    if: inputs.resume_run == ''
    uses: ./.github/workflows/build.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  visual:
    if: inputs.resume_run == ''
    uses: ./.github/workflows/visual.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  shaders:
    if: inputs.resume_run == ''
    uses: ./.github/workflows/shaders.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  release:
    needs: [build, visual, shaders]
    runs-on: [self-hosted, linux, x64, nstut-linux-pool, cloud-1, nstut-profile-minecraft-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/r2-artifact
        with:
          operation: download
          workflow: build
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          pattern: simply-mirrors-*
          path: release-input
          expected: simply-mirrors-fabric-1.16.5 simply-mirrors-forge-1.16.5 simply-mirrors-fabric-1.20.1 simply-mirrors-forge-1.20.1 simply-mirrors-fabric-1.21.1 simply-mirrors-neoforge-1.21.1 simply-mirrors-fabric-26.1.2 simply-mirrors-neoforge-26.1.2
      - name: Verify all eight release jars and prepare checksums
        run: python tools/release.py collect --input release-input --output release-output
      - uses: ./.github/actions/r2-artifact
        with:
          operation: upload
          workflow: release
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          name: simply-mirrors-release-bundle
          path: release-output/*
          if-no-files-found: error
      - name: Decide whether this version should publish
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: python tools/release.py plan
      - name: Validate publishing setup and CurseForge tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.plan.outputs.publish == 'true'
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/release.py preflight --input release-output
      - name: Create GitHub release for this commit
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TYPE: ${{ steps.plan.outputs.release_type }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TYPE" != release ]]; then flags+=(--prerelease); fi
          if gh release view "v$MOD_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; verify it and resume individual uploads manually." >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/v$MOD_VERSION" >/dev/null 2>&1; then
            echo "Version tag already exists; verify its commit before releasing." >&2
            exit 1
          fi
          gh release create "v$MOD_VERSION" release-output/*.jar release-output/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Simply Mirrors v$MOD_VERSION" \
            --notes-file "changelog/$MOD_VERSION.md" "${flags[@]}"
      - name: Upload all eight files to CurseForge
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.plan.outputs.publish == 'true'
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/release.py publish --input release-output
      - uses: ./.github/actions/r2-artifact
        if: always()
        with:
          operation: upload
          workflow: release
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          name: curseforge-upload-receipts
          path: release-output/curseforge-receipts.json
          if-no-files-found: ignore
  resume-curseforge:
    # Manually authorized main-branch recovery; never runs on PR code.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.resume_run != '' && inputs.publish
    runs-on: [self-hosted, linux, x64, nstut-linux-pool, cloud-1, nstut-profile-minecraft-ci]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified release artifacts and inspected receipts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.resume_run }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          python -m pip install --disable-pip-version-check boto3==1.40.74
          python tools/r2_recovery.py "$SOURCE_RUN" release-output
          python -m pip install pillow
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/verify_recovery.py "$SOURCE_RUN" release-output
      - name: Resume only missing CurseForge uploads
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/release.py publish --input release-output --resume
      - uses: ./.github/actions/r2-artifact
        if: always()
        with:
          operation: upload
          workflow: release
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          name: curseforge-upload-receipts
          path: release-output/curseforge-receipts.json
          if-no-files-found: ignore
