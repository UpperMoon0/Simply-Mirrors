name: Build and release
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to GitHub and CurseForge (main only)
        type: boolean
        default: false
      resume_run:
        description: Inspected failed run with accepted CurseForge receipts (recovery only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: simply-mirrors-release
  cancel-in-progress: false
jobs:
  build:
    if: inputs.resume_run == ''
    uses: ./.github/workflows/build.yml
  visual:
    if: inputs.resume_run == ''
    uses: ./.github/workflows/visual.yml
  shaders:
    if: inputs.resume_run == ''
    uses: ./.github/workflows/shaders.yml
  release:
    needs: [build, visual, shaders]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: simply-mirrors-*
          path: release-input
      - name: Verify all eight release jars and prepare checksums
        run: python tools/release.py collect --input release-input --output release-output
      - uses: actions/upload-artifact@v4
        with:
          name: simply-mirrors-release-bundle
          path: release-output/*
          if-no-files-found: error
      - name: Decide whether this version should publish
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: python tools/release.py plan
      - name: Validate publishing setup and CurseForge tags
        if: steps.plan.outputs.publish == 'true'
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/release.py preflight --input release-output
      - name: Create GitHub release for this commit
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TYPE: ${{ steps.plan.outputs.release_type }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TYPE" != release ]]; then flags+=(--prerelease); fi
          if gh release view "v$MOD_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; verify it and resume individual uploads manually." >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/v$MOD_VERSION" >/dev/null 2>&1; then
            echo "Version tag already exists; verify its commit before releasing." >&2
            exit 1
          fi
          gh release create "v$MOD_VERSION" release-output/*.jar release-output/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Simply Mirrors v$MOD_VERSION" \
            --notes-file "changelog/$MOD_VERSION.md" "${flags[@]}"
      - name: Upload all eight files to CurseForge
        if: steps.plan.outputs.publish == 'true'
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/release.py publish --input release-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curseforge-upload-receipts
          path: release-output/curseforge-receipts.json
          if-no-files-found: ignore
  resume-curseforge:
    if: github.event_name == 'workflow_dispatch' && inputs.resume_run != '' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified release artifacts and inspected receipts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.resume_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_RUN" -n simply-mirrors-release-bundle -D release-output
          gh run download "$SOURCE_RUN" -n curseforge-upload-receipts -D release-output
          python -m pip install pillow
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/verify_recovery.py "$SOURCE_RUN" release-output
      - name: Resume only missing CurseForge uploads
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/release.py publish --input release-output --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curseforge-upload-receipts
          path: release-output/curseforge-receipts.json
          if-no-files-found: ignore
