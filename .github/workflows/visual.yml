name: Mirror visual acceptance
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mirror:
    name: Visual ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: fabric-1.16.5, java: '8', gradle_java: '21'}
          - {target: forge-1.16.5, java: '8', gradle_java: '21'}
          - {target: fabric-1.20.1, java: '17', gradle_java: '21'}
          - {target: forge-1.20.1, java: '17', gradle_java: '21'}
          - {target: fabric-1.21.1, java: '21', gradle_java: '21'}
          - {target: neoforge-1.21.1, java: '21', gradle_java: '21'}
          - {target: fabric-26.1.2, java: '25', gradle_java: '25'}
          - {target: neoforge-26.1.2, java: '25', gradle_java: '25'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.gradle_java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxi6 libxinerama1
          python -m pip install pillow
          chmod +x gradlew forge-1.16.5/gradlew fabric-26.1.2/gradlew neoforge-26.1.2/gradlew
      - name: Render and verify all six mirror faces
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python tools/visual_smoke.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-visual-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/run/visual-evidence/**
            ${{ matrix.target }}/run/visual-client/visual-evidence/**
            ${{ matrix.target }}/run/visual-client/logs/**
            ${{ matrix.target }}/run/visual-client/crash-reports/**
            ${{ matrix.target }}/run/visual-server/logs/**
          if-no-files-found: warn
