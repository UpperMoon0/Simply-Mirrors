name: ATM10 Sky full modpack visual acceptance

# TEMPORARY ISSUE #5 REPRODUCTION ONLY. Never add this to the official
# release/test requirements or allow it to run on main. Delete this entire
# workflow and pack-specific fixtures before merging PR #6.
on:
  workflow_dispatch:
    inputs:
      renderer_only:
        description: 'Diagnostic only: exact Iris/Sodium/Euphoria/Complementary subset'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - test/neoforge-shader-modpack-repro-issue-5
    paths:
      - .github/workflows/atm10-sky.yml
      - tools/atm10_sky_visual.py
      - tools/atm10_sky_production.py
      - tools/atm10_sky.py
      - tools/atm10-sky/**
      - tools/test_atm10_sky.py
      - visual-tests/1.21.1/java/com/nstut/simplymirrors/visualtest/Atm10Framebuffer*.java
      - visual-tests/1.21.1/java/com/nstut/simplymirrors/visualsupport/Atm10FramebufferTrace.java

permissions:
  contents: read

concurrency:
  group: atm10-sky-full-${{ github.ref }}
  # Preserve long-running screenshot evidence when another diagnostic commit lands.
  cancel-in-progress: false

jobs:
  real-modpack:
    name: Real ATM10 Sky 2.3.1 / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [off, complementary, euphoria]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '3'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare private virtual display and native rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxi6 libxinerama1
          python -m pip install pillow minecraft-launcher-lib==8.0
          chmod +x gradlew
          echo "Runner: $(uname -a)"
      - name: Verify installer and fixture isolation regressions
        run: python -m unittest discover -s tools -p 'test_atm10_sky.py' -v
      - name: Download and verify every exact ATM10 Sky dependency
        run: |
          python tools/atm10_sky.py \
            --output build/atm10-sky/game \
            --cache build/atm10-sky/downloads \
            --workers 8
      - name: Production NeoForge full-pack shader reflection capture (six orientations)
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' \
            python tools/atm10_sky_production.py \
              --game build/atm10-sky/game \
              --mode '${{ matrix.mode }}' \
              ${{ inputs.renderer_only && '--renderer-only' || '' }}
      - name: Upload real visual evidence, startup logs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atm10-sky-${{ inputs.renderer_only && 'renderer-only' || 'real' }}-${{ matrix.mode }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/atm10-sky/game/qa-evidence/modpack-inventory.json
            neoforge-1.21.1/run/atm10-${{ matrix.mode }}-evidence/**
            neoforge-1.21.1/run/atm10-renderer-only-${{ matrix.mode }}-evidence/**
            neoforge-1.21.1/run/atm10-${{ matrix.mode }}-client/visual-evidence/**
            neoforge-1.21.1/run/atm10-renderer-only-${{ matrix.mode }}-client/visual-evidence/**
            neoforge-1.21.1/run/atm10-${{ matrix.mode }}-client/logs/**
            neoforge-1.21.1/run/atm10-renderer-only-${{ matrix.mode }}-client/logs/**
            neoforge-1.21.1/run/atm10-${{ matrix.mode }}-client/crash-reports/**
            neoforge-1.21.1/run/atm10-renderer-only-${{ matrix.mode }}-client/crash-reports/**
            neoforge-1.21.1/run/atm10-${{ matrix.mode }}-client/config/iris.properties
            neoforge-1.21.1/run/atm10-renderer-only-${{ matrix.mode }}-client/config/iris.properties
