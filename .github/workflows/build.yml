name: Build and verify
on:
  workflow_call:
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reflection-core:
    # Untrusted fork PRs must never execute on private self-hosted machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Reflection math (Java 8)
    runs-on: [self-hosted, linux, x64, nstut-linux-pool, cloud-1, nstut-profile-minecraft-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: chmod +x gradlew
      - run: ./gradlew -Ptarget=common :common:test --no-daemon --console=plain
      - uses: ./.github/actions/r2-artifact
        if: always()
        with:
          operation: upload
          workflow: build
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          name: reflection-core-test-results
          path: common/build/test-results/test
  shader-history-gl:
    # Untrusted fork PRs must never execute on private self-hosted machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Shader history isolation (OpenGL)
    runs-on: [self-hosted, linux, x64, nstut-linux-pool, cloud-1, nstut-profile-minecraft-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify runner's preinstalled headless OpenGL
        run: |
          command -v Xvfb
          command -v xvfb-run
          test -f /usr/lib/x86_64-linux-gnu/libGLX_mesa.so.0
          chmod +x gradlew
      - name: Verify native texture history and GL state restoration
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew -Ptarget=common :common:shaderHistoryGlTest --no-daemon --console=plain
      - name: Compare per-block and batched mirror composites with pixel parity
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew -Ptarget=common :common:mirrorCompositeBenchmark --no-daemon --console=plain
  builds:
    # Untrusted fork PRs must never execute on private self-hosted machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.target }}
    runs-on: [self-hosted, linux, x64, nstut-linux-pool, cloud-1, nstut-profile-minecraft-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: fabric-1.16.5, java: '8', gradle_java: '21'}
          - {target: forge-1.16.5, java: '8', gradle_java: '21'}
          - {target: fabric-1.20.1, java: '17', gradle_java: '21'}
          - {target: forge-1.20.1, java: '17', gradle_java: '21'}
          - {target: fabric-1.21.1, java: '21', gradle_java: '21'}
          - {target: neoforge-1.21.1, java: '21', gradle_java: '21'}
          - {target: fabric-26.1.2, java: '25', gradle_java: '25'}
          - {target: neoforge-26.1.2, java: '25', gradle_java: '25'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.gradle_java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew forge-1.16.5/gradlew fabric-26.1.2/gradlew neoforge-26.1.2/gradlew
      - run: python tools/build.py --target ${{ matrix.target }} --skip-tests
      - uses: ./.github/actions/r2-artifact
        with:
          operation: upload
          workflow: build
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          name: simply-mirrors-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/libs/*.jar
            !${{ matrix.target }}/build/libs/*-sources.jar
            !${{ matrix.target }}/build/libs/*-dev.jar
            !${{ matrix.target }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error
  release-package:
    # Untrusted fork PRs must never execute on private self-hosted machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Verify eight-target release bundle
    needs: [reflection-core, shader-history-gl, builds]
    runs-on: [self-hosted, linux, x64, nstut-linux-pool, cloud-1, nstut-profile-minecraft-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/r2-artifact
        with:
          operation: download
          workflow: build
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          pattern: simply-mirrors-*
          path: release-input
          expected: simply-mirrors-fabric-1.16.5 simply-mirrors-forge-1.16.5 simply-mirrors-fabric-1.20.1 simply-mirrors-forge-1.20.1 simply-mirrors-fabric-1.21.1 simply-mirrors-neoforge-1.21.1 simply-mirrors-fabric-26.1.2 simply-mirrors-neoforge-26.1.2
      - run: python tools/release.py collect --input release-input --output release-output
      - uses: ./.github/actions/r2-artifact
        with:
          operation: upload
          workflow: build
          endpoint: ${{ vars.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          name: verified-release-bundle
          path: release-output/*
          if-no-files-found: error
