name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reflection-core:
    name: Reflection math (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -Ptarget=common :common:test --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflection-core-test-results
          path: common/build/test-results/test
  builds:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: fabric-1.16.5, java: '8', gradle_java: '21'}
          - {target: forge-1.16.5, java: '8', gradle_java: '21'}
          - {target: fabric-1.20.1, java: '17', gradle_java: '21'}
          - {target: forge-1.20.1, java: '17', gradle_java: '21'}
          - {target: fabric-1.21.1, java: '21', gradle_java: '21'}
          - {target: neoforge-1.21.1, java: '21', gradle_java: '21'}
          - {target: fabric-26.1.2, java: '25', gradle_java: '25'}
          - {target: neoforge-26.1.2, java: '25', gradle_java: '25'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.gradle_java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew forge-1.16.5/gradlew fabric-26.1.2/gradlew neoforge-26.1.2/gradlew
      - run: python tools/build.py --target ${{ matrix.target }} --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: simply-mirrors-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/libs/*.jar
            !${{ matrix.target }}/build/libs/*-sources.jar
            !${{ matrix.target }}/build/libs/*-dev.jar
            !${{ matrix.target }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error
