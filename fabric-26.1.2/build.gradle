plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
version = shared.mod_version
group = shared.maven_group
base { archivesName = 'simply_mirrors-fabric-26.1.2' }
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.java.srcDir('../common-client/src/main/java')
sourceSets.main.java.srcDir('../common-26.1.2/src/main/java')
sourceSets.main.resources.srcDir('../common-26.1.2/src/main/resources')
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.18.6'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.152.1+26.1.2'
    implementation 'net.fabricmc.fabric-api:fabric-object-builder-api-v1:23.0.17+b95dd56e4c'
    implementation 'net.fabricmc.fabric-api:fabric-creative-tab-api-v1:5.0.11+d871b99e4c'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
}
tasks.withType(Jar).configureEach { from('../LICENSE'); from('../NOTICE') }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }

apply from: file('../tools/visual.gradle')

sourceSets.main.resources.srcDir('../common-assets/src/main/resources')
